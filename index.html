<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 主题色 / color-scheme 由 app.js 的 THEME 按当前主题改，不写死两条 -->
<meta name="theme-color" content="#eef4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="错题集">
<meta name="description" content="拍一张，AI 帮你整理好。错题集 · 会自己排队的错题本，还会举一反三。">
<title>错题集</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 背景：暖纸 + 一层极淡的光 + 慢慢飘的萤火 + 纸纹 -->
<div class="bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="fireflies"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="noise"></div>
</div>

<div id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="seal" aria-hidden="true">错</div>
      <div class="brand-txt">
        <b>错题集</b>
        <i>MISTAKE COLLECTION</i>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2M6.1 6.1l1.4 1.4M16.5 16.5l1.4 1.4M17.9 6.1l-1.4 1.4M7.5 16.5l-1.4 1.4"/>
      </svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
    <button data-tab="home" data-idx="0" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 10.4 12 4l8 6.4V20a.8.8 0 0 1-.8.8h-4.4v-6H9.2v6H4.8A.8.8 0 0 1 4 20z"/></svg><span>首页</span>
    </button>
    <button data-tab="bank" data-idx="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 4.5h13.5v15H5z"/><path d="M8.2 9h7.2M8.2 12.2h7.2M8.2 15.4h4.4"/></svg><span>题库</span>
    </button>
    <button data-tab="add" data-idx="2" class="tab-add" aria-label="拍摄错题">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 6.2v11.6M6.2 12h11.6"/></svg></span>
    </button>
    <button data-tab="review" data-idx="3">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.6V9h-5.4"/></svg><span>复习</span>
    </button>
    <button data-tab="stats" data-idx="4">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19.5V12M10 19.5V5M15 19.5v-5M20 19.5V8.5"/></svg><span>记录</span>
    </button>
  </nav>
</div>

<!-- ===== 拍照 / 框选 / 扫描台 ===== -->
<section class="studio" id="studio" aria-hidden="true">
  <header class="st-top">
    <button class="st-btn" data-st="cancel">取消</button>
    <div class="st-title" id="stTitle">框选题目</div>
    <button class="st-btn primary" data-st="apply">使用</button>
  </header>

  <div class="st-stage" id="stStage">
    <div class="st-wrap" id="stWrap">
      <canvas id="stCanvas"></canvas>
      <div class="cropbox" id="stBox">
        <div class="crop-grid"></div>
        <i class="ch nw" data-ch="nw"></i><i class="ch ne" data-ch="ne"></i>
        <i class="ch sw" data-ch="sw"></i><i class="ch se" data-ch="se"></i>
      </div>
      <div class="st-scanline" id="stScan" aria-hidden="true"></div>
    </div>
    <div class="studio-hint" id="stHint">拖动方框选单道题 · 拖四角缩放</div>
  </div>

  <div class="st-tools">
    <div class="st-row" id="stModes">
      <button class="st-chip on" data-mode="color">增强</button>
      <button class="st-chip" data-mode="bw">黑白</button>
      <button class="st-chip" data-mode="raw">原图</button>
      <button class="st-chip" data-st="full">整页</button>
      <button class="st-chip" data-st="rotate">旋转</button>
    </div>
    <div class="st-sliders" id="stSliders">
      <label class="st-sl"><span>亮度</span><input type="range" id="stBright" min="-70" max="70" value="0"></label>
      <label class="st-sl"><span>对比</span><input type="range" id="stContrast" min="-40" max="110" value="30"></label>
    </div>
  </div>
</section>

<!-- ===== AI 识题中 ===== -->
<div class="ai-veil" id="aiVeil" aria-hidden="true">
  <div class="ai-card">
    <div class="ai-scan">
      <canvas id="aiThumb"></canvas>
      <span class="ai-laser"></span>
    </div>
    <div class="ai-txt">
      <b id="aiStat">AI 正在读题…</b>
      <small id="aiSub">识别学科 · 难度 · 知识点 · 题干</small>
    </div>
    <div class="ai-bars"><i></i><i></i><i></i></div>
    <button class="btn ghost block" id="aiCancel" data-act="ai-cancel" style="margin-top:16px;font-size:13px;padding:10px">先不等了，我自己填</button>
  </div>
</div>

<!-- 全屏浮层（添加/详情/设置） -->
<div class="sheet-mask" id="mask"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>

<!-- 题图灯箱：点开放大，可捏合 / 双击缩放 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lbImg" alt="题图" draggable="false">
  <div class="lb-hint">双指捏合放大 · 双击放大 · 点空白处关闭</div>
  <button class="lb-x" data-act="lb-close" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<div class="onboard" id="onboard" aria-hidden="true"></div>
<div class="onboard" id="onboard" aria-hidden="true"></div>
<script src="vendor/workbuddy-cloud-sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
